[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "curvemill"
version = "0.1.0"
description = "Desktop DXF editor and CNC endmill cut preview tool."
requires-python = ">=3.11"
dependencies = [
    "ezdxf>=1.3",
    "PySide6>=6.7",
    "shapely>=2.0",
    "Pillow>=10.0",
    "pywin32>=312",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
curvemill = "curvemill.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

